syntax = "proto3";

package will.v1;


service Messenger {
    rpc Session(stream ClientEvent) returns (stream ServerEvent) {}
}


message BindToken {
   string token = 1;
}


message ChatMessage {
    string name = 1;
    string body = 2;
}


message HistoryRequest {
    uint32 limit = 1;
}


message AuthRequired {}


message AuthOk {
    string name = 1;
}


message ReceiptAck {}


message HistoryItem {
    uint64 message_id = 1;
    bool is_mine = 2;
    string name = 3;
    string body = 4;
}


message HistoryEnd {}


message Supplicate {
    string addressee_name = 1;
}


message AcceptSupplication {
    string suppliant_name = 1;
}


message WillDeed {
    string novice_name = 1;
    string body = 2;
}


message ExecuteDeed {
    uint64 deed_id = 1;
}


message SupplicationOffer {
    string suppliant_name = 1;
}


message TieFormed {
    uint64 tie_id = 1;
    string counterpart_name = 2;
    bool as_novice = 3;
}


message DeedOffered {
    uint64 deed_id = 1;
    string testator_name = 2;
    string body = 3;
}


message DeedDone {
    uint64 deed_id = 1;
    string novice_name = 2;
}


message ProtocolNotice {
    string message = 1;
}


message ClientEvent {
    oneof event {
        BindToken bind_token = 1;
        ChatMessage chat = 2;
        HistoryRequest history_request = 3;
        Supplicate supplicate = 4;
        AcceptSupplication accept_supplication = 5;
        WillDeed will_deed = 6;
        ExecuteDeed execute_deed = 7;
    }
}


message ServerEvent {
    oneof event {
        AuthRequired auth_required = 1;
        AuthOk auth_ok = 2;
        ChatMessage chat = 3;
        ReceiptAck receipt_ack = 4;
        HistoryItem history_item = 5;
        HistoryEnd history_end = 6;
        SupplicationOffer supplication_offer = 7;
        TieFormed tie_formed = 8;
        DeedOffered deed_offered = 9;
        DeedDone deed_done = 10;
        ProtocolNotice protocol_notice = 11;
    }
}
