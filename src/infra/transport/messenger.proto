syntax = "proto3";

package will.v1;


service Messenger {
    rpc Session(stream ClientEvent) returns (stream ServerEvent) {}
}


message BindToken {
   string token = 1;
}


// Text the client says into the place he contemplates: a letter in an abode,
// a behest in a tie where he is the testator.
message ChatMessage {
    string name = 1;
    string body = 2;
}


// The last words of the place he contemplates.
message HistoryRequest {
    uint32 limit = 1;
}


message AuthRequired {}


// The body is welcomed: the man dwelling in it by his name, or, unborn, the
// mark of the body by which the keepers of gates see it.
message AuthOk {
    string name = 1;
    bool unborn = 2;
    uint64 mark = 3;
    // The server's present instant (nanoseconds since the epoch), the same by
    // which it dates words and efforts: the client sets its clock by it at once.
    int64 server_time_ns = 4;
}


// The saying is placed; the word it became, as its author sees it: the server
// does not tell the author his word otherwise.
message ReceiptAck {
    Word word = 1;
}


// One go at an exercise: so many repetitions with this weight, in grams (zero
// weight is one's own), and the rest before it, in seconds.
message Approach {
    uint32 weight_grams = 1;
    uint32 repetitions = 2;
    uint32 rest_seconds = 3;
}


// An exercise, named freely, done in approaches; the testator's instruction for it, if he
// gave one.
message Exercise {
    string name = 1;
    repeated Approach approaches = 2;
    string instruction = 3;
}


// An approach of a training done: which one (by place, from zero), with what
// weight and how many repetitions, begun and finished when (nanoseconds since
// the epoch). The rest before it is the time since the effort before it finished.
message Effort {
    uint32 exercise = 1;
    uint32 approach = 2;
    uint32 weight_grams = 3;
    uint32 repetitions = 4;
    int64 begun_at_ns = 5;
    int64 finished_at_ns = 6;
    uint32 strain = 7;  // how it went, in marks: none as it should, one with effort, two hard
}


// A remark of the novice on an exercise of a training (by place, from zero), said
// when (nanoseconds since the epoch).
message Remark {
    uint32 exercise = 1;
    string body = 2;
    int64 said_at_ns = 3;
}


// A word in the place the client contemplates — told in history or as it is placed.
// A behest that is a training carries the exercises it wills; a deed fulfilling
// one, the exercises done.
message Word {
    enum Kind {
        LETTER = 0;
        BEHEST = 1;
        DEED = 2;
    }

    uint64 id = 1;
    bool is_mine = 2;
    string name = 3;      // its author
    string body = 4;
    Kind kind = 5;
    uint64 behest_id = 6; // the behest a deed fulfils
    repeated Exercise exercises = 7;
    repeated Effort efforts = 8;  // a training: the approaches done so far
    repeated Remark remarks = 9;  // a training: the novice's remarks on its exercises
}


message HistoryEnd {}


message Supplicate {
    string addressee_name = 1;
}


message AcceptSupplication {
    string suppliant_name = 1;
}


// Turn the gaze to an abode — the abode of this host one dwells in, or one's
// own when abode_of is empty — and, when room is given, into that room of it.
// A tie is seen through the room reflecting it.
message Turn {
    reserved 1;
    string abode_of = 2;
    string room = 3;
}


// The part of an abode a room stands in.
enum RoomPart {
    INNER = 0; // its friends enter
    OUTER = 1; // its neighbours enter too
}


// Ask for the rooms one may enter in an abode: one's own when abode_of is
// empty. The gaze stays where it is.
message ListRooms {
    string abode_of = 1;
}


// Ask for the abodes one dwells in.
message ListDwellings {}


// Ask for the supplications awaiting one's answer.
message ListSupplications {}


// Reject the supplication of this soul.
message RejectSupplication {
    string suppliant_name = 1;
}


// Set a room of one's abode in this part of it.
message Arrange {
    string room = 1;
    RoomPart part = 2;
}


// How a host regards a dweller of his abode.
enum DwellerKind {
    ACQUAINTANCE = 0; // sees only that he dwells there
    NEIGHBOUR = 1;    // sees the outer part
    FRIEND = 2;       // sees all
}


// Admit this soul into one's abode as an acquaintance.
message Admit {
    string name = 1;
}


// Regard this dweller of one's abode as of this kind.
message Regard {
    string name = 1;
    DwellerKind kind = 2;
}


// Ask for the dwellers of one's abode.
message ListDwellers {}


// Fulfil a behest of the contemplated tie, with an optional report. A training
// is fulfilled with the exercises done; none given, as willed.
message Fulfil {
    uint64 behest_id = 1;
    string report = 2;
    repeated Exercise performed = 3;
}


// Begin an approach of a training of the tie one looks at as its novice.
message BeginApproach {
    uint64 behest_id = 1;
    uint32 exercise = 2;
    uint32 approach = 3;
}


// Say a remark on an exercise of a training not yet fulfilled.
message SayRemark {
    uint64 behest_id = 1;
    uint32 exercise = 2;
    string body = 3;
}


// End the approach underway now; what was done in it is told after, by FinishApproach.
message EndApproach {
    uint64 behest_id = 1;
}


// The client's heartbeat: numbered, it is answered by its Reply, and the client knows it is
// heard; it changes nothing. The unborn beat too.
message Heartbeat {}


// Finish the approach underway with the weight and repetitions done: it finished when it
// ended, or now if it was not ended before.
message FinishApproach {
    uint64 behest_id = 1;
    uint32 weight_grams = 2;
    uint32 repetitions = 3;
    uint32 strain = 4;  // as in Effort
}


// Will a training in the tie one looks at as its testator: these exercises,
// under this title («Тренировка» when empty).
message Train {
    string title = 1;
    repeated Exercise exercises = 2;
}


// Bear the unborn with this mark, standing in gates one keeps: the child is born
// of the host of those gates.
message Bear {
    uint64 mark = 1;
}


// Choose this soul as one's father by spirit; he cannot refuse.
message ChooseFather {
    string name = 1;
}


// Ask for one's whole spiritual line.
message ListLineage {}


message SupplicationOffer {
    string suppliant_name = 1;
}


message TieFormed {
    uint64 tie_id = 1;
    string counterpart_name = 2;
    bool as_novice = 3;
}


// What a room reflects: the words of a place, the threshold of the abode (the
// gates, through which one comes in, born or to be born), or its dwellers (the
// helm).
enum RoomAspect {
    WORDS = 0;
    THRESHOLD = 1;
    DWELLERS = 2;
    reserved 3;  // the birth room: one is born through the gates now
    reserved "BIRTH";
}


// The gaze now rests on an abode (of this host, or one's own when empty) — in
// this room of it, when room is given. writable: one may write here (one's own
// cell; a tie room of which one is the testator).
message Turned {
    reserved 1;
    string abode_of = 2;
    string room = 3;
    bool writable = 4;
    RoomAspect aspect = 5;
    string testator = 6;  // as Room.testator, of the room one turned to
}


// The gates one stands in: open while their host, who alone keeps them, stands in
// them. keeping: one is their host; to him, who stands at them waiting to be let in.
message Threshold {
    bool open = 1;
    repeated string waiting = 2;
    bool keeping = 3;
}


// aspect: only a cell (WORDS) is moved from part to part; the gates are the core of
// the outer part, the helm of the inner.
message Room {
    string name = 1;
    RoomPart part = 2;
    RoomAspect aspect = 3;
    string testator = 4;  // the room reflects a tie whose novice is the host: its testator
}


// The rooms of the abode one looks at that one may enter.
message Rooms {
    repeated Room rooms = 1;
}


message OutstandingBehest {
    string room = 1;
    Word behest = 2;
    Underway underway = 3;  // a training's approach underway, if one is
    string counterpart = 4;  // the other of the tie: the testator to the novice, the novice to the testator
}


// What is not yet fulfilled in the rooms of the host's ties: what awaits his
// attention, where he is the novice; what he has set for others, where he is
// the testator. And what is fulfilled where he is the testator, its deed not yet
// seen by him: what he has to review. And how many stand at his gates waiting to
// be let in: unknown to him, they are not named here.
message Outstanding {
    repeated OutstandingBehest owed = 1;
    repeated OutstandingBehest awaited = 2;
    repeated OutstandingBehest unreviewed = 3;
    uint32 waiting = 4;
}


// One dwells in this host's abode, regarded as of this kind: told when admitted
// and when regarded anew.
message Dwelling {
    string host_name = 1;
    DwellerKind kind = 2;
}


// A dweller of an abode, and how he stands to its host as a trainer: the host
// asked him to become his trainer, and it awaits an answer (asked); he asks the
// host (asks); he is the host's trainer (trainer); the host is his (novice).
message Dweller {
    string name = 1;
    DwellerKind kind = 2;
    bool asked = 3;
    bool asks = 4;
    bool trainer = 5;
    bool novice = 6;
}


// The abodes one dwells in, and how their hosts regard one.
message Dwellings {
    repeated Dwelling dwellings = 1;
}


// The souls whose supplications await one's answer, oldest first.
message Supplications {
    repeated string suppliant_names = 1;
}


// The dwellers of one's abode.
message Dwellers {
    repeated Dweller dwellers = 1;
}


// The approach of a training underway now (doing), or that none of it is: told
// to those who look at the tie when one begins or finishes, and to one entering a
// room of it, for each training underway. The training is named either way.
message Underway {
    uint64 behest_id = 1;
    uint32 exercise = 2;
    uint32 approach = 3;
    int64 begun_at_ns = 4;
    bool doing = 5;
    int64 ended_at_ns = 6;  // ended, and what was done in it not yet told; zero while it goes on
}


// The novice remarked on an exercise of a training: told to those who look at the tie.
message Remarked {
    uint64 behest_id = 1;
    Remark remark = 2;
}


// An approach of a training is done: told to those who look at the tie.
message Exerted {
    uint64 behest_id = 1;
    Effort effort = 2;
}


// The bodies awaiting their birth, by their marks, told to one standing in gates
// he keeps: on entering them and whenever one comes or is born.
message Unborn {
    repeated uint64 marks = 1;
}


message Descent {
    string name = 1;
    string father_name = 2;
}


// One's spiritual line, generation by generation: each child with his father.
message Lineage {
    repeated Descent descents = 1;
}


// A new word was placed in a tie one is a side of, while one looks elsewhere;
// room is the room of one's abode reflecting that tie; word is the word itself:
// a behest or training set, or a deed done.
message Stirred {
    reserved 1;
    string author_name = 2;
    string room = 3;
    Word word = 4;
}


// What a notice tells, by code: each client says it in its own words, the names and
// numbers in it given apart (args, in the order the code's words name them). The
// message is the server's own words, for whoever does not know the code.
enum NoticeCode {
    NOTICE_UNSPECIFIED = 0;

    // What the world refuses (a domain Refusal and its reason).
    // 14 was «only the host writes»: one's word is in one's own abode, so only its host stands there.
    reserved 14;
    // 1, 10, 11 and 15 told where a deed is done, each its own: one refusal for each kind of room tells it now.
    reserved 1, 10, 11, 15;
    // 16 and 17 kept one from asking oneself or a stranger: one asks now at one's own helm, among its dwellers.
    reserved 16, 17;
    // 2, 6, 39 and 43 told who besides the host might act in his rooms: only the host acts there now.
    reserved 2, 6, 39, 43;
    // 5 told that one bears only at gates: one bears now standing in them, as one does there all else.
    reserved 5;
    NOTICE_ALREADY_DWELLS = 3;
    NOTICE_NOT_AT_GATES = 4;
    NOTICE_NO_SUCH_UNBORN = 7;
    NOTICE_DOES_NOT_DWELL = 8;
    NOTICE_DOES_NOT_ENTER_ROOM = 9;
    NOTICE_FATHER_BY_FLESH_NEIGHBOUR = 12;
    NOTICE_FATHER_BY_SPIRIT_FRIEND = 13;
    NOTICE_HEAR_ONLY_DWELLER = 18;
    NOTICE_ALREADY_TIED = 19;
    NOTICE_TIE_ONLY_MUTUAL_DWELLERS = 20;
    NOTICE_UNKNOWN_SUPPLICATION = 21;
    NOTICE_WILL_ONLY_IN_CONTEMPLATED_TIE = 22;
    NOTICE_ONLY_TESTATOR_WILLS = 23;
    NOTICE_FULFIL_ONLY_IN_CONTEMPLATED_TIE = 24;
    NOTICE_ONLY_NOVICE_FULFILS = 25;
    NOTICE_ALREADY_FULFILLED = 26;
    NOTICE_PLAIN_BEHEST_WITHOUT_EXERCISES = 27;
    NOTICE_TRAIN_ONLY_IN_CONTEMPLATED_TIE = 28;
    NOTICE_ONLY_NOVICE_TRAINS = 29;
    NOTICE_NO_SUCH_EXERCISE = 30;
    NOTICE_NO_SUCH_APPROACH = 31;
    NOTICE_APPROACH_ALREADY_DONE = 32;
    NOTICE_APPROACHES_IN_ORDER = 33;
    NOTICE_ANOTHER_APPROACH_UNDERWAY = 34;
    NOTICE_NO_APPROACH_UNDERWAY = 35;
    NOTICE_FINISH_APPROACH_FIRST = 36;
    NOTICE_NOT_OWN_FATHER = 37;
    NOTICE_NOT_DESCENDANT_AS_FATHER = 38;
    NOTICE_STAND_IN_CELL = 40;
    NOTICE_STAND_AT_HELM = 41;
    NOTICE_STAND_AT_GATES = 42;
    NOTICE_ONLY_HOST_ACTS = 44;
    NOTICE_PASS_THROUGH_GATES = 45;
    NOTICE_TELL_WHAT_WAS_DONE = 46;

    // What the server itself refuses.
    // 102–104, 108 and 111 were the server's own copies of the world's rules: the
    // world refuses those itself now.
    reserved 102, 103, 104, 108, 111;
    NOTICE_INVALID_NAME = 100;
    NOTICE_UNKNOWN_NAME = 101;
    NOTICE_NO_SUCH_ROOM = 105;
    NOTICE_YOU_DO_NOT_DWELL = 106;
    NOTICE_YOU_DO_NOT_ENTER = 107;
    NOTICE_UNKNOWN_BEHEST = 109;
    NOTICE_UNKNOWN_KIND = 110;
    NOTICE_INVALID_TRAINING = 112;
    NOTICE_UNKNOWN_TRAINING = 113;
    NOTICE_FATHER_BY_SPIRIT_CLOSED = 114;
    NOTICE_AWAITS_BIRTH = 115;

    // What was done.
    NOTICE_SUPPLICATION_SENT = 200;
    NOTICE_BEHEST_FULFILLED = 201;        // args: behest id
    // 203 told the host who let whom in at his gates: only the host lets in now.
    reserved 203;
    NOTICE_ADMITTED = 202;                // args: who was let in
    NOTICE_REGARDED = 204;                // args: who
    NOTICE_ARRANGED_OUTER = 205;          // args: room
    NOTICE_ARRANGED_INNER = 206;          // args: room
    NOTICE_TRAINING_WILLED = 207;         // args: training id
    NOTICE_BORN = 208;                    // args: who was born
    NOTICE_SUPPLICATION_REJECTED = 209;   // args: whose
    NOTICE_SUPPLICATION_DECLINED = 210;   // to the suppliant; args: who declined it
}


message ProtocolNotice {
    string message = 1;
    NoticeCode code = 2;
    repeated string args = 3;
}


// The answer to a client event that carried a request_id: granted or refused, with
// what the server has to say of it. While it answers a numbered request the server
// tells the asker nothing else of its own; the asker knows its answer by the number,
// not by the words.
message Reply {
    uint64 request_id = 1;
    bool granted = 2;
    string notice = 3;
    NoticeCode code = 4;
    repeated string args = 5;
}


message ClientEvent {
    oneof event {
        BindToken bind_token = 1;
        ChatMessage chat = 2;
        HistoryRequest history_request = 3;
        Supplicate supplicate = 4;
        AcceptSupplication accept_supplication = 5;
        Turn turn = 6;
        Fulfil fulfil = 7;
        Admit admit = 8;
        Regard regard = 9;
        ListDwellers list_dwellers = 10;
        Arrange arrange = 11;
        ListDwellings list_dwellings = 12;
        ListSupplications list_supplications = 13;
        RejectSupplication reject_supplication = 14;
        ListRooms list_rooms = 15;
        Bear bear = 16;
        ChooseFather choose_father = 17;
        ListLineage list_lineage = 18;
        Train train = 19;
        BeginApproach begin_approach = 20;
        FinishApproach finish_approach = 21;
        SayRemark say_remark = 22;
        EndApproach end_approach = 23;
        Heartbeat heartbeat = 24;
    }
    // Numbered, the event is answered by one Reply with this number; zero, as before,
    // by notices.
    uint64 request_id = 100;
}


message ServerEvent {
    oneof event {
        AuthRequired auth_required = 1;
        AuthOk auth_ok = 2;
        ReceiptAck receipt_ack = 4;
        Word word = 5;
        HistoryEnd history_end = 6;
        SupplicationOffer supplication_offer = 7;
        TieFormed tie_formed = 8;
        Turned turned = 9;
        Stirred stirred = 10;
        ProtocolNotice protocol_notice = 11;
        Dwelling dwelling = 12;
        Dwellers dwellers = 13;
        Rooms rooms = 14;
        Outstanding outstanding = 15;
        Dwellings dwellings = 16;
        Supplications supplications = 17;
        Threshold threshold = 18;
        Unborn unborn = 19;
        Lineage lineage = 20;
        Underway underway = 21;
        Exerted exerted = 22;
        Reply reply = 23;
        Remarked remarked = 24;
    }
}
