syntax = "proto3";

package will.v1;


service Messenger {
    rpc Session(stream ClientEvent) returns (stream ServerEvent) {}
}


message BindToken {
   string token = 1;
}


// Text the client says into the place he contemplates: a letter in an abode,
// a behest in a tie where he is the testator.
message ChatMessage {
    string name = 1;
    string body = 2;
}


// The last words of the place he contemplates.
message HistoryRequest {
    uint32 limit = 1;
}


message AuthRequired {}


// The body is welcomed: the man dwelling in it by his name, or, unborn, the
// mark of the body by which it is seen in birth rooms.
message AuthOk {
    string name = 1;
    bool unborn = 2;
    uint64 mark = 3;
}


message ReceiptAck {}


// One go at an exercise: so many repetitions with this weight, in grams (zero
// weight is one's own), and the rest after it, in seconds.
message Approach {
    uint32 weight_grams = 1;
    uint32 repetitions = 2;
    uint32 rest_seconds = 3;
}


// An exercise, named freely, done in approaches.
message Exercise {
    string name = 1;
    repeated Approach approaches = 2;
}


// An approach of a training done: which one (by place, from zero), with what
// weight and how many repetitions, begun and finished when (nanoseconds since
// the epoch). The rest before it is the time since the effort before it finished.
message Effort {
    uint32 exercise = 1;
    uint32 approach = 2;
    uint32 weight_grams = 3;
    uint32 repetitions = 4;
    int64 begun_at_ns = 5;
    int64 finished_at_ns = 6;
}


// A word in the place the client contemplates — told in history or as it is placed.
// A behest that is a training carries the exercises it wills; a deed fulfilling
// one, the exercises done.
message Word {
    enum Kind {
        LETTER = 0;
        BEHEST = 1;
        DEED = 2;
    }

    uint64 id = 1;
    bool is_mine = 2;
    string name = 3;      // its author
    string body = 4;
    Kind kind = 5;
    uint64 behest_id = 6; // the behest a deed fulfils
    repeated Exercise exercises = 7;
    repeated Effort efforts = 8;  // a training: the approaches done so far
}


message HistoryEnd {}


message Supplicate {
    string addressee_name = 1;
}


message AcceptSupplication {
    string suppliant_name = 1;
}


// Turn the gaze to an abode — the abode of this host one dwells in, or one's
// own when abode_of is empty — and, when room is given, into that room of it.
// A tie is seen through the room reflecting it.
message Turn {
    reserved 1;
    string abode_of = 2;
    string room = 3;
}


// The part of an abode a room stands in.
enum RoomPart {
    INNER = 0; // its friends enter
    OUTER = 1; // its neighbours enter too
}


// Ask for the rooms one may enter in an abode: one's own when abode_of is
// empty. The gaze stays where it is.
message ListRooms {
    string abode_of = 1;
}


// Ask for the abodes one dwells in.
message ListDwellings {}


// Ask for the supplications awaiting one's answer.
message ListSupplications {}


// Reject the supplication of this soul.
message RejectSupplication {
    string suppliant_name = 1;
}


// Set a room of one's abode in this part of it.
message Arrange {
    string room = 1;
    RoomPart part = 2;
}


// How a host regards a dweller of his abode.
enum DwellerKind {
    ACQUAINTANCE = 0; // sees only that he dwells there
    NEIGHBOUR = 1;    // sees the outer part
    FRIEND = 2;       // sees all
}


// Admit this soul into one's abode as an acquaintance.
message Admit {
    string name = 1;
}


// Regard this dweller of one's abode as of this kind.
message Regard {
    string name = 1;
    DwellerKind kind = 2;
}


// Ask for the dwellers of one's abode.
message ListDwellers {}


// Fulfil a behest of the contemplated tie, with an optional report. A training
// is fulfilled with the exercises done; none given, as willed.
message Fulfil {
    uint64 behest_id = 1;
    string report = 2;
    repeated Exercise performed = 3;
}


// Begin an approach of a training of the tie one looks at as its novice.
message BeginApproach {
    uint64 behest_id = 1;
    uint32 exercise = 2;
    uint32 approach = 3;
}


// Finish the approach underway with the weight and repetitions done.
message FinishApproach {
    uint64 behest_id = 1;
    uint32 weight_grams = 2;
    uint32 repetitions = 3;
}


// Will a training in the tie one looks at as its testator: these exercises,
// under this title («Тренировка» when empty).
message Train {
    string title = 1;
    repeated Exercise exercises = 2;
}


// Bear the unborn with this mark, standing in a birth room: the child is born
// of the host of that room.
message Bear {
    uint64 mark = 1;
}


// Choose this soul as one's father by spirit; he cannot refuse.
message ChooseFather {
    string name = 1;
}


// Ask for one's whole spiritual line.
message ListLineage {}


message SupplicationOffer {
    string suppliant_name = 1;
}


message TieFormed {
    uint64 tie_id = 1;
    string counterpart_name = 2;
    bool as_novice = 3;
}


// What a room reflects: the words of a place, the threshold of the abode (the
// gates), its dwellers (the upper room), or the unborn (the birth room).
enum RoomAspect {
    WORDS = 0;
    THRESHOLD = 1;
    DWELLERS = 2;
    BIRTH = 3;
}


// The gaze now rests on an abode (of this host, or one's own when empty) — in
// this room of it, when room is given. writable: one may write here (one's own
// cell; a tie room of which one is the testator).
message Turned {
    reserved 1;
    string abode_of = 2;
    string room = 3;
    bool writable = 4;
    RoomAspect aspect = 5;
}


// The gates one stands in: open while one who keeps them stands in them — the
// host, or a dweller whose kind enters their part. keeping: one keeps them
// oneself; to those who keep them, who stands at them waiting to be let in.
message Threshold {
    bool open = 1;
    repeated string waiting = 2;
    bool keeping = 3;
}


message Room {
    string name = 1;
    RoomPart part = 2;
}


// The rooms of the abode one looks at that one may enter.
message Rooms {
    repeated Room rooms = 1;
}


message OutstandingBehest {
    string room = 1;
    Word behest = 2;
}


// What is not yet fulfilled in the rooms of the host's ties: what awaits his
// attention, where he is the novice; what he has set for others, where he is
// the testator.
message Outstanding {
    repeated OutstandingBehest owed = 1;
    repeated OutstandingBehest awaited = 2;
}


// One dwells in this host's abode, regarded as of this kind: told when admitted
// and when regarded anew.
message Dwelling {
    string host_name = 1;
    DwellerKind kind = 2;
}


message Dweller {
    string name = 1;
    DwellerKind kind = 2;
}


// The abodes one dwells in, and how their hosts regard one.
message Dwellings {
    repeated Dwelling dwellings = 1;
}


// The souls whose supplications await one's answer, oldest first.
message Supplications {
    repeated string suppliant_names = 1;
}


// The dwellers of one's abode.
message Dwellers {
    repeated Dweller dwellers = 1;
}


// The approach of a training the novice is doing now (doing), or that he does
// none now: told to those who look at the tie when he begins or finishes, and to
// one entering a room of it.
message Underway {
    uint64 behest_id = 1;
    uint32 exercise = 2;
    uint32 approach = 3;
    int64 begun_at_ns = 4;
    bool doing = 5;
}


// An approach of a training is done: told to those who look at the tie.
message Exerted {
    uint64 behest_id = 1;
    Effort effort = 2;
}


// The bodies awaiting their birth, by their marks, told to one standing in a
// birth room: on entering it and whenever one comes or is born.
message Unborn {
    repeated uint64 marks = 1;
}


message Descent {
    string name = 1;
    string father_name = 2;
}


// One's spiritual line, generation by generation: each child with his father.
message Lineage {
    repeated Descent descents = 1;
}


// A new word was placed in a tie one is a side of, while one looks elsewhere;
// room is the room of one's abode reflecting that tie.
message Stirred {
    reserved 1;
    string author_name = 2;
    string room = 3;
}


message ProtocolNotice {
    string message = 1;
}


message ClientEvent {
    oneof event {
        BindToken bind_token = 1;
        ChatMessage chat = 2;
        HistoryRequest history_request = 3;
        Supplicate supplicate = 4;
        AcceptSupplication accept_supplication = 5;
        Turn turn = 6;
        Fulfil fulfil = 7;
        Admit admit = 8;
        Regard regard = 9;
        ListDwellers list_dwellers = 10;
        Arrange arrange = 11;
        ListDwellings list_dwellings = 12;
        ListSupplications list_supplications = 13;
        RejectSupplication reject_supplication = 14;
        ListRooms list_rooms = 15;
        Bear bear = 16;
        ChooseFather choose_father = 17;
        ListLineage list_lineage = 18;
        Train train = 19;
        BeginApproach begin_approach = 20;
        FinishApproach finish_approach = 21;
    }
}


message ServerEvent {
    oneof event {
        AuthRequired auth_required = 1;
        AuthOk auth_ok = 2;
        ReceiptAck receipt_ack = 4;
        Word word = 5;
        HistoryEnd history_end = 6;
        SupplicationOffer supplication_offer = 7;
        TieFormed tie_formed = 8;
        Turned turned = 9;
        Stirred stirred = 10;
        ProtocolNotice protocol_notice = 11;
        Dwelling dwelling = 12;
        Dwellers dwellers = 13;
        Rooms rooms = 14;
        Outstanding outstanding = 15;
        Dwellings dwellings = 16;
        Supplications supplications = 17;
        Threshold threshold = 18;
        Unborn unborn = 19;
        Lineage lineage = 20;
        Underway underway = 21;
        Exerted exerted = 22;
    }
}
