syntax = "proto3";

package will.v1;


service Messenger {
    rpc Session(stream ClientEvent) returns (stream ServerEvent) {}
}


message BindToken {
   string token = 1;
}


// Text the client says into the place he contemplates: a letter in an abode,
// a behest in a tie where he is the testator.
message ChatMessage {
    string name = 1;
    string body = 2;
}


// The last words of the place he contemplates.
message HistoryRequest {
    uint32 limit = 1;
}


message AuthRequired {}


message AuthOk {
    string name = 1;
}


message ReceiptAck {}


// A word in the place the client contemplates — told in history or as it is placed.
message Word {
    enum Kind {
        LETTER = 0;
        BEHEST = 1;
        DEED = 2;
    }

    uint64 id = 1;
    bool is_mine = 2;
    string name = 3;      // its author
    string body = 4;
    Kind kind = 5;
    uint64 behest_id = 6; // the behest a deed fulfils
}


message HistoryEnd {}


message Supplicate {
    string addressee_name = 1;
}


message AcceptSupplication {
    string suppliant_name = 1;
}


// Turn the gaze to the tie with this soul, or home to one's own abode when empty.
message Turn {
    string tie_with = 1;
}


// Fulfil a behest of the contemplated tie, with an optional report.
message Fulfil {
    uint64 behest_id = 1;
    string report = 2;
}


message SupplicationOffer {
    string suppliant_name = 1;
}


message TieFormed {
    uint64 tie_id = 1;
    string counterpart_name = 2;
    bool as_novice = 3;
}


// The gaze now rests on the tie with this soul, or at home when empty.
message Turned {
    string tie_with = 1;
}


// A new word was placed in a tie one dwells in but does not contemplate.
message Stirred {
    string tie_with = 1;
    string author_name = 2;
}


message ProtocolNotice {
    string message = 1;
}


message ClientEvent {
    oneof event {
        BindToken bind_token = 1;
        ChatMessage chat = 2;
        HistoryRequest history_request = 3;
        Supplicate supplicate = 4;
        AcceptSupplication accept_supplication = 5;
        Turn turn = 6;
        Fulfil fulfil = 7;
    }
}


message ServerEvent {
    oneof event {
        AuthRequired auth_required = 1;
        AuthOk auth_ok = 2;
        ReceiptAck receipt_ack = 4;
        Word word = 5;
        HistoryEnd history_end = 6;
        SupplicationOffer supplication_offer = 7;
        TieFormed tie_formed = 8;
        Turned turned = 9;
        Stirred stirred = 10;
        ProtocolNotice protocol_notice = 11;
    }
}
